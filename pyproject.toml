[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "edugraph"
version = "0.1.0"
description = "Análise topológica e detecção de comunidades em redes educacionais bipartidas (TCC Grupo 16 — UniAnchieta)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Gabriel Luís Lopes" },
    { name = "Pedro Alexandre dos Santos Chaves" },
    { name = "Lucas Timponi Mercadante Castro" },
]
# Pinadas, não floors (ADR-0011): mesmas versões de requirements.txt.
# CI e `pip install -e ".[dev]"` precisam resultar no mesmo ambiente que
# `pip install -r requirements.txt` — senão os dois caminhos divergem e
# um "funciona na minha máquina" vira bug de CI (foi o que aconteceu:
# numpy>=2.0 deixava a CI puxar 2.5.x, cujos stubs usam sintaxe do
# Python 3.12 e quebravam o mypy configurado para 3.11).
dependencies = [
    "networkx==3.6.1",
    "numpy==2.4.4",
    "pandas==3.0.2",
    "scipy==1.17.1",
    "python-louvain==0.16",
    "fastapi==0.141.1",
    "uvicorn==0.53.0",
    "matplotlib==3.11.2",
]

[project.optional-dependencies]
# Mesmas versões de requirements-dev.txt, pelo mesmo motivo acima.
# pandas-stubs e types-networkx ficam sem pin: são só stubs de tipo,
# atualizados com frequência, e o que importa é que casem com as
# versões pinadas de pandas/networkx acima — não com um número fixo.
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.16.8",
    "mypy==2.3.1",
    "httpx==0.28.1",
    "pandas-stubs",
    "types-networkx",
]

[project.scripts]
edugraph = "edugraph.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["edugraph*"]

[tool.setuptools.package-data]
edugraph = ["api/static/**/*"]

# ---------------------------------------------------------------------
# Ruff — lint e formatação
# ---------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]
extend-exclude = ["frontend"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "PTH", "RUF"]
ignore = [
    "RUF001",  # caracteres ambíguos: docstrings em português usam acentuação
    "RUF002",
    "RUF003",
    "N803",    # nomes matemáticos (G, B, Q) seguem a notação do artigo
    "N806",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]

[tool.ruff.format]
quote-style = "double"

# ---------------------------------------------------------------------
# Mypy — estrito apenas sobre contracts/ (ver docs/testes/estrategia.md)
# ---------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
files = ["src/edugraph"]
ignore_missing_imports = true
warn_unused_configs = true
show_error_codes = true

[[tool.mypy.overrides]]
module = "edugraph.contracts.*"
strict = true
disallow_any_explicit = false

# ---------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: execuções longas (Girvan-Newman completo, OULAD inteiro); fora da CI",
    "oulad: exige o OULAD baixado em data/raw/oulad",
    "dataset(name): exige que o dataset indicado exista sob alguma raiz de artefatos",
]
