# OULAD com V = apresentação de módulo (22 nós) — a granularidade
# recomendada pela decisão D1 para a projeção disciplina↔disciplina e
# para a identificação de disciplinas críticas (spec C-03).
#
# Com V = módulo, a projeção disciplina↔disciplina degenera no grafo
# completo: toda intermediação vira zero e não há gargalo a identificar.
# Isso já é observável em data/fixtures/synthetic_v1 (ver o REFERENCE.md
# de lá) e a configuração oulad_module_baseline.toml existe justamente
# para reportar a degeneração como resultado.
#
# Exige o OULAD baixado em data/raw/oulad (ver README).

name = "oulad_module_presentation"
stages = ["data", "community", "centrality"]

[source]
kind = "oulad"
raw_dir = "data/raw/oulad"
cache_dir = "data/interim"

[bipartite]
dataset = "oulad_module_presentation"
granularity = "module_presentation"
edge_criterion = "score_threshold"
threshold = 40.0   # limiar de aprovação do OULAD; conferir em A-02

# Medido em 18/09/2026 (A-06): 22.425 alunos, 22 disciplinas, 24.500
# arestas; 91,8% dos alunos cursam **um único módulo** (grau mediano 1).
#
# ATENÇÃO, projeção aluno↔aluno: a base inteira daria ~15,9 milhões de
# pares. Tentar construí-la aqui passou de 5 GB de RAM sem terminar em
# 10 min, e `min_weight` NÃO resolve — o corte acontece depois de
# acumular os pares, então reduz o artefato, não o pico de memória.
#
# Por isso as duas projeções de aluno ficam **desligadas** nesta
# configuração. Para comunidades de alunos, use uma amostra
# (`sample_students` abaixo) ou a configuração por coorte. Ligar as duas
# linhas abaixo sem amostra trava a máquina.
#
# [[projections]]
# side = "student"
# weighting = "simple"
# implementation = "manual"
# min_weight = 2.0
#
# [[projections]]
# side = "student"
# weighting = "resource_allocation"
# implementation = "manual"

# Disciplina↔disciplina: 22 nós, 93 de 231 arestas possíveis (40%).
# **Não é o grafo completo** — ao contrário do que a decisão D1 previa e
# do que acontece em synthetic_v1 (K₇). A esparsidade real (mediana de
# um módulo por aluno) impede a completude, e a intermediação discrimina.
# É a configuração recomendada para as disciplinas críticas (spec C-03).
[[projections]]
side = "discipline"
weighting = "simple"
implementation = "manual"

[[projections]]
side = "discipline"
weighting = "resource_allocation"
implementation = "manual"

[community]
algorithms = ["louvain"]

[community.louvain]
seed = 42
resolution = 1.0

[centrality]
metrics = ["degree", "betweenness", "eigenvector"]

[centrality.betweenness]
weight_mode = "none"
# Intermediação exata é O(nm); na base inteira, usar amostragem de pivôs
# e reportar que o valor é estimativa.
k = 500
seed = 42
