<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Modo apresentador — edugraph</title>
  <link rel="stylesheet" href="css/apresentacao.css" />
  <style>
    html, body { overflow: hidden; background: #161512; color: #ece8df; font: 400 16px/1.5 var(--sans); }
    .ap { height: 100dvh; display: grid; grid-template-rows: auto 1fr; }
    .ap-topo { display: flex; align-items: center; gap: 18px; padding: 12px 20px; border-bottom: 1px solid #3d3a33; }
    .ap-topo h1 { font: 600 19px var(--serif); margin-right: auto; display: flex; align-items: center; gap: 10px; }
    .ap-topo h1 svg { width: 36px; height: 18px; }
    .relogio { display: flex; align-items: baseline; gap: 10px; font: 400 34px/1 var(--serif); font-variant-numeric: tabular-nums; }
    .relogio small { font: 400 14px var(--sans); color: #908b7f; }
    .relogio.atrasado { color: #ffb37a; }
    .hora { font-size: 15px; color: #bdb8ac; font-variant-numeric: tabular-nums; }
    .ap button { border: 1px solid #5a564c; background: #1c1b18; color: #ece8df; border-radius: 999px; padding: 8px 16px; font-size: 14px; }
    .ap button:hover { background: #2c2a25; }
    .ap button.primario { background: #ece8df; color: #161512; border-color: #ece8df; font-weight: 600; }
    .ap-corpo { display: grid; grid-template-columns: 1.55fr 1fr; gap: 18px; padding: 18px 20px; min-height: 0; }
    .ap-esq { display: grid; grid-template-rows: auto 1fr auto; gap: 10px; min-height: 0; }
    .ap-dir { display: grid; grid-template-rows: auto auto minmax(0, 1fr); gap: 10px; min-height: 0; }
    .rotulo-ap { font: italic 400 15px var(--serif); color: #908b7f; display: flex; justify-content: space-between; gap: 12px; }
    .rotulo-ap b { font: 600 15px var(--sans); color: #ece8df; font-style: normal; }
    .previa { position: relative; width: 100%; aspect-ratio: 16 / 9; border-radius: 8px; overflow: hidden; border: 1px solid #3d3a33; background: #fbfaf7; }
    .previa iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; pointer-events: none; }
    .ap-esq .previa { align-self: start; }
    .notas-ap { overflow-y: auto; background: #1c1b18; border: 1px solid #3d3a33; border-radius: 8px; padding: 18px 22px; font-size: 19px; line-height: 1.6; color: #e2ddd2; }
    .notas-ap p { margin: 0 0 12px; }
    .notas-ap b { color: #fff; }
    .notas-ap code { font: 15px var(--mono); color: #bdb8ac; }
    .notas-ap i { color: #fff; }
    .nav-ap { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .nav-ap .grande { font-size: 18px; padding: 12px 26px; }
    .contador-ap { font: 400 22px var(--serif); font-variant-numeric: tabular-nums; margin: 0 8px; }
    .aviso-ap { background: #3a2a1d; color: #ffd8b8; border-radius: 8px; padding: 10px 14px; font-size: 15px; display: none; gap: 12px; align-items: center; }
    .aviso-ap.on { display: flex; }
    .estado-demo { font-size: 14px; color: #908b7f; }
    .estado-demo.on { color: #7cc49a; }
    .atalhos { font-size: 13px; color: #908b7f; }
    kbd { font: 600 12px var(--sans); border: 1px solid #5a564c; border-bottom-width: 2px; border-radius: 4px; padding: 1px 6px; color: #bdb8ac; }
  </style>
</head>
<body>
<div class="ap">
  <header class="ap-topo">
    <h1><svg viewBox="0 0 32 16" aria-hidden="true"><circle cx="5" cy="8" r="4.5" fill="#56B4E9"/><path d="M16 3 21 12.5H11Z" fill="#E69F00"/><rect x="23" y="3.5" width="8.5" height="8.5" rx="2" fill="#009E73"/></svg>Modo apresentador</h1>
    <div class="relogio" id="cronometro" title="Tempo decorrido · T zera"><span>00:00</span><small id="alvo"></small></div>
    <button type="button" id="zerar">Zerar (T)</button>
    <span class="hora" id="hora"></span>
  </header>
  <div class="ap-corpo">
    <section class="ap-esq">
      <p class="rotulo-ap"><span>Agora</span><b id="titulo-atual"></b></p>
      <div class="previa"><iframe id="previa-atual" title="Slide atual" tabindex="-1"></iframe></div>
      <div class="nav-ap">
        <button type="button" class="grande" data-cmd="anterior">← Anterior</button>
        <span class="contador-ap" id="contador"></span>
        <button type="button" class="grande primario" data-cmd="proximo">Próximo →</button>
        <span style="flex:1"></span>
        <button type="button" data-cmd="demo-entrar">Entrar na demo (D)</button>
        <button type="button" data-cmd="demo-sair">Sair da demo (Esc)</button>
        <span class="estado-demo" id="estado-demo">demo fechada</span>
        <button type="button" data-cmd="cortina">Tela preta (B)</button>
      </div>
    </section>
    <section class="ap-dir">
      <p class="rotulo-ap"><span>A seguir</span><b id="titulo-proximo"></b></p>
      <div class="previa"><iframe id="previa-proxima" title="Próximo slide" tabindex="-1"></iframe></div>
      <div style="display:grid; grid-template-rows:auto auto minmax(0,1fr); gap:10px; min-height:0">
        <div class="aviso-ap" id="aviso"><span>A janela da plateia não respondeu. As notas seguem funcionando aqui.</span><button type="button" id="abrir-plateia">Abrir a janela da plateia</button></div>
        <p class="atalhos"><kbd>→</kbd> <kbd>espaço</kbd> avança · <kbd>←</kbd> volta · <kbd>D</kbd> demo · <kbd>Esc</kbd> sai da demo · <kbd>B</kbd> tela preta · <kbd>T</kbd> zera o tempo</p>
        <div class="notas-ap" id="notas" aria-live="polite"></div>
      </div>
    </section>
  </div>
</div>
<script src="js/config.js"></script>
<script src="js/apresentador.js"></script>
</body>
</html>
